<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>股票评分分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--tx2:#8b949e;--up:#f85149;--dn:#3fb950;--bl:#58a6ff;--or:#d29922;--pp:#a371f7}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:520px;margin:0 auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
header{text-align:center;padding:12px 0 20px}
header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
header p{font-size:12px;color:var(--tx2);margin-top:4px}

.source-toggle{display:flex;gap:6px;justify-content:center;margin-bottom:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px}
.source-toggle span{flex:1;text-align:center;font-size:12px;padding:8px 10px;border-radius:8px;color:var(--tx2);cursor:pointer;transition:all .2s}
.source-toggle span.active{background:var(--bl);color:#fff;font-weight:600}
.source-toggle span:active{opacity:.8}

.search{display:flex;gap:8px;margin-bottom:8px}
.search input{flex:1;padding:14px 16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-size:16px;-webkit-appearance:none;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--bl)}
.search button{padding:14px 22px;background:var(--bl);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
.search button:active{opacity:.8}
.hint{font-size:11px;color:var(--tx2);margin-bottom:12px;text-align:center}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.quick span{font-size:12px;padding:5px 10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;color:var(--tx2);cursor:pointer}
.quick span:active{background:var(--bd)}

.scan-box{background:linear-gradient(135deg,#1c1620 0%,#161b22 100%);border:1px solid #8b4a2b;border-radius:16px;padding:16px;margin-bottom:12px}
.scan-btn{width:100%;padding:14px;background:linear-gradient(135deg,#f85149,#d29922);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.scan-btn:active{opacity:.85}
.scan-btn:disabled{opacity:.55;cursor:wait}
.scan-desc{font-size:11px;color:var(--tx2);text-align:center;margin-top:8px;line-height:1.5}
.scan-status{font-size:12px;color:var(--tx2);text-align:center;margin-top:10px;min-height:16px;line-height:1.5}
.scan-status.active{color:var(--bl)}
.scan-results{margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)}
.scan-summary{font-size:12px;color:var(--tx2);margin-bottom:10px;text-align:center;line-height:1.6}
.scan-summary b{color:var(--up);font-size:14px}
.scan-item{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:background .15s}
.scan-item:active{background:rgba(255,255,255,.08)}
.scan-rank{font-size:11px;font-weight:700;width:22px;text-align:center;color:var(--tx2);flex-shrink:0}
.scan-rank.top1{color:#ffd700}
.scan-rank.top2{color:#c0c0c0}
.scan-rank.top3{color:#cd7f32}
.scan-info{flex:1;min-width:0}
.scan-name{font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan-code{font-size:11px;color:var(--tx2)}
.scan-price{font-size:12px;font-weight:600;text-align:right}
.scan-price.up{color:var(--up)}
.scan-price.dn{color:var(--dn)}
.scan-score{font-size:20px;font-weight:800;text-align:right;flex-shrink:0;min-width:46px}
.scan-score.s90{color:#f85149}
.scan-score.s85{color:#d29922}
.scan-score.s80{color:#58a6ff}
.scan-dims{display:flex;gap:4px;margin-top:4px;font-size:10px;color:var(--tx2)}
.scan-dims span{padding:1px 5px;background:rgba(255,255,255,.04);border-radius:4px}
.scan-empty{font-size:12px;color:var(--tx2);text-align:center;padding:14px 0;line-height:1.6}
.scan-note{font-size:11px;color:var(--or);padding:8px 10px;background:rgba(210,153,34,.08);border-radius:8px;margin-top:8px;line-height:1.6;text-align:center}

.status{text-align:center;padding:40px 0;color:var(--tx2);font-size:14px;display:none}
.status.on{display:block}
.spinner{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.error{background:rgba(248,81,73,.1);border:1px solid var(--up);border-radius:12px;padding:16px;color:var(--up);font-size:14px;text-align:center;margin-bottom:16px;display:none}
.error.on{display:block}
.content{display:none}
.content.on{display:block}

.overview{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
.ov-name{font-size:18px;font-weight:600}
.ov-code{font-size:12px;color:var(--tx2);margin-top:2px}
.ov-price{font-size:34px;font-weight:700;margin:8px 0 4px}
.ov-chg{font-size:15px;font-weight:600}
.ov-chg.up{color:var(--up)}
.ov-chg.dn{color:var(--dn)}
.ov-time{font-size:11px;color:var(--tx2);margin-top:8px}

.advice-card{background:linear-gradient(135deg,#161b22 0%,#1a2130 100%);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
.advice-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.verdict{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;padding:8px 16px;border-radius:12px}
.v-strong{background:rgba(248,81,73,.18);color:var(--up)}
.v-rec{background:rgba(210,153,34,.18);color:var(--or)}
.v-wait{background:rgba(88,166,255,.18);color:var(--bl)}
.v-avoid{background:rgba(139,148,158,.18);color:var(--tx2)}
.verdict .vd-icon{font-size:20px}
.style-tag{font-size:13px;font-weight:600;padding:6px 12px;border-radius:10px;background:rgba(163,113,247,.15);color:var(--pp);display:flex;align-items:center;gap:4px}
.advice-desc{font-size:12px;color:var(--tx2);text-align:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--bd)}
.targets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tg-item{background:rgba(255,255,255,.03);border-radius:10px;padding:10px 12px}
.tg-label{font-size:11px;color:var(--tx2);margin-bottom:4px}
.tg-price{font-size:16px;font-weight:700;margin-bottom:2px}
.tg-pct{font-size:11px;font-weight:600}
.tg-pct.up{color:var(--up)}
.tg-pct.dn{color:var(--dn)}

.score-card{background:linear-gradient(135deg,#161b22 0%,#1c2230 100%);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:12px;text-align:center}
.score-total{font-size:56px;font-weight:800;line-height:1;letter-spacing:-2px}
.score-total.up{color:var(--up)}
.score-total.mid{color:var(--or)}
.score-total.low{color:var(--dn)}
.score-label{font-size:11px;color:var(--tx2);margin-top:6px;letter-spacing:2px}
.score-rating{display:inline-block;font-size:13px;font-weight:600;padding:4px 14px;border-radius:20px;margin-top:8px}
.rating-5{background:rgba(248,81,73,.15);color:var(--up)}
.rating-4{background:rgba(210,153,34,.15);color:var(--or)}
.rating-3{background:rgba(88,166,255,.15);color:var(--bl)}
.rating-2{background:rgba(163,113,247,.15);color:var(--pp)}
.rating-1{background:rgba(63,185,80,.15);color:var(--dn)}
.score-dims{margin-top:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.dim-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.dim-head .dn-name{color:var(--tx2)}
.dim-head .dn-val{font-weight:600}
.bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.fill-g{background:linear-gradient(90deg,#3fb950,#56d364)}
.fill-y{background:linear-gradient(90deg,#d29922,#e3b341)}
.fill-r{background:linear-gradient(90deg,#f85149,#ff7b72)}
.fill-b{background:linear-gradient(90deg,#58a6ff,#79c0ff)}
.fill-p{background:linear-gradient(90deg,#a371f7,#bc8cff)}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.card-head .ico{font-size:18px}
.card-head h2{font-size:15px;font-weight:600;flex:1}
.card-head .tag{font-size:11px;padding:2px 8px;border-radius:6px}
.tag.long{background:rgba(88,166,255,.15);color:var(--bl)}
.tag.short{background:rgba(210,153,34,.15);color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{background:rgba(255,255,255,.03);border-radius:10px;padding:10px 12px}
.item .lb{font-size:11px;color:var(--tx2);margin-bottom:4px}
.item .vl{font-size:16px;font-weight:600;word-break:break-all}
.vl.up{color:var(--up)}
.vl.dn{color:var(--dn)}
.vl.bl{color:var(--bl)}
.vl.or{color:var(--or)}

.breakdown{margin-top:14px;padding-top:12px;border-top:1px dashed var(--bd)}
.bd-title{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.bd-row{margin-bottom:10px;padding:10px 12px;background:rgba(255,255,255,.02);border-radius:8px}
.bd-row:last-child{margin-bottom:0}
.bd-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;align-items:center}
.bd-label{color:var(--tx2)}
.bd-score{font-weight:700;font-size:13px;color:var(--bl)}
.bd-score.full{color:var(--up)}
.bd-score.low{color:var(--dn)}
.bd-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-bottom:6px}
.bd-fill{height:100%;border-radius:2px;transition:width .5s ease}
.bd-meta{font-size:11px;color:var(--tx2);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bd-meta b{color:var(--tx);font-weight:600}
.bd-reason{font-size:11px;color:var(--or);line-height:1.5}

.kline-wrap{margin:0 -4px}
#klineChart{width:100%;height:230px;display:block}
.legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--tx2);margin-top:6px;flex-wrap:wrap}

details.rules{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0;margin-bottom:12px;overflow:hidden}
details.rules>summary{padding:16px;font-size:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.rules>summary::-webkit-details-marker{display:none}
details.rules>summary::after{content:'▾';margin-left:auto;color:var(--tx2);transition:transform .2s}
details.rules[open]>summary::after{transform:rotate(180deg)}
.rules-body{padding:0 16px 16px;border-top:1px solid var(--bd);font-size:12px;color:var(--tx2);line-height:1.7}
.rules-body h4{margin:14px 0 8px;font-size:13px;color:var(--tx);display:flex;align-items:center;gap:6px}
.rules-body h4:first-child{margin-top:12px}
.rules-body table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:6px}
.rules-body td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.rules-body td:first-child{color:var(--tx);white-space:nowrap}
.rules-body td:last-child{text-align:right;color:var(--bl);font-weight:600;white-space:nowrap}
.rules-body .r-note{color:var(--or);font-size:11px;margin-top:6px;padding:8px 10px;background:rgba(210,153,34,.08);border-radius:6px;line-height:1.6}

.foot{text-align:center;font-size:11px;color:var(--tx2);padding:20px 0;line-height:1.8}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📊 股票评分分析</h1>
    <p>基本面 · 技术面 · 资金面 · 情绪面</p>
  </header>

  <!-- 数据源切换 -->
  <div class="source-toggle" id="sourceToggle">
    <span data-src="sdk" class="active">📦 stock-sdk</span>
    <span data-src="tencent">📡 腾讯接口</span>
  </div>

  <div class="scan-box">
    <button id="scanBtn" class="scan-btn">🔥 扫描全市场高分股</button>
    <div class="scan-desc">剔除创业板 · 科创板 · 北交所 · ST 股<br>沪深主板全量扫描，筛选评分 &gt; 85 的优质标的</div>
    <div class="scan-status" id="scanStatus">点击按钮开始扫描</div>
    <div class="scan-results" id="scanResults" style="display:none"></div>
  </div>

  <div class="search">
    <input id="code" type="text" placeholder="股票代码或名称，如 600519 / 茅台" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off">
    <button id="go">分析</button>
  </div>
  <div class="hint">支持代码、中文名、拼音首字母（如 gzmt）</div>
  <div class="quick" id="quick"></div>
  <div class="status" id="status"><div class="spinner"></div><p>正在获取数据...</p></div>
  <div class="error" id="error"></div>
  <div class="content" id="content"></div>
  <div class="foot">数据来源：stock-sdk / 腾讯财经公开接口<br>评分与目标价仅供参考，不构成投资建议</div>
</div>

<script type="module">
import { StockSDK } from 'https://cdn.jsdelivr.net/npm/stock-sdk@1.10.1/dist/index.js';

// ============ 全局状态 ============
let currentSource = 'sdk';
const sdk = new StockSDK();

const QUICK = [
  {name:'茅台',code:'600519'},{name:'平安',code:'601318'},
  {name:'宁德',code:'300750'},{name:'比亚迪',code:'002594'},
  {name:'招行',code:'600036'},{name:'隆基',code:'601012'}
];

// ============ 工具 ============
function jsonp(url, timeout){
  timeout = timeout || 15000;
  return new Promise((resolve,reject)=>{
    const name='jp'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    s.src=url+(url.includes('?')?'&':'?')+'cb='+name;
    const timer=setTimeout(()=>{cleanup();reject(new Error('请求超时'))},timeout);
    function cleanup(){clearTimeout(timer);try{delete window[name]}catch(e){window[name]=undefined}s.remove()}
    window[name]=d=>{cleanup();resolve(d)};
    s.onerror=()=>{cleanup();reject(new Error('网络加载失败'))};
    document.head.appendChild(s);
  });
}
function avg(a){return a&&a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function ema(arr,p){const k=2/(p+1);const r=[arr[0]];for(let i=1;i<arr.length;i++)r.push(arr[i]*k+r[i-1]*(1-k));return r}
function calcRSI(c,p){if(c.length<=p)return null;let g=0,l=0;for(let i=c.length-p;i<c.length;i++){const d=c[i]-c[i-1];if(d>0)g+=d;else l-=d}const ag=g/p,al=l/p;if(al===0)return 100;return 100-100/(1+ag/al)}
function calcKDJ(k,n){const rsv=[];for(let i=0;i<k.length;i++){if(i<n-1){rsv.push(50);continue}const w=k.slice(i-n+1,i+1);const h=Math.max(...w.map(x=>x.high)),lo=Math.min(...w.map(x=>x.low));rsv.push(h===lo?50:(k[i].close-lo)/(h-lo)*100)}let pk=50,pd=50,kv=50,dv=50,jv=50;for(let i=0;i<rsv.length;i++){kv=(2*pk+rsv[i])/3;dv=(2*pd+kv)/3;jv=3*kv-2*dv;pk=kv;pd=dv}return{k:kv,d:dv,j:jv}}
function calcBOLL(c,p,m){const s=c.slice(-p);const mid=avg(s);const v=s.reduce((a,b)=>a+Math.pow(b-mid,2),0)/p;const sd=Math.sqrt(v);return{upper:mid+m*sd,mid,lower:mid-m*sd}}
function calcATR(k,p){if(k.length<p+1)return null;let sum=0;for(let i=k.length-p;i<k.length;i++){const tr=Math.max(k[i].high-k[i].low,Math.abs(k[i].high-k[i-1].close),Math.abs(k[i].low-k[i-1].close));sum+=tr}return sum/p}
function fmt(v,d=2){return (v===null||v===undefined||isNaN(v))?'--':Number(v).toFixed(d)}
function money(v){if(v===null||v===undefined||isNaN(v))return'--';const n=Number(v);if(Math.abs(n)>=1e8)return(n/1e8).toFixed(2)+'亿';if(Math.abs(n)>=1e4)return(n/1e4).toFixed(2)+'万';return n.toFixed(0)}
function item(lb,vl,cls=''){return `<div class="item"><div class="lb">${lb}</div><div class="vl ${cls}">${vl}</div></div>`}

// ============ 符号转换 ============
function toSinaCode(code){return /^6/.test(code)?'sh'+code:'sz'+code}
function toTencentCode(code){return /^6/.test(code)?'sh'+code:'sz'+code}

// ============ 数据获取：stock-sdk ============
async function sdkFetchQuote(code){
  const fullCode = /^6/.test(code)?'sh'+code:'sz'+code;
  const quotes = await sdk.getFullQuotes([fullCode]);
  if(!quotes || !quotes.length) throw new Error('未找到股票');
  const q = quotes[0];
  return {
    f43: q.price, f44: q.high, f45: q.low, f46: q.open, f47: q.volume,
    f48: q.amount ? q.amount * 10000 : 0, f50: q.volumeRatio,
    f57: q.code, f58: q.name,
    f116: q.totalMarketCap ? q.totalMarketCap * 1e8 : 0,
    f117: q.circulatingMarketCap ? q.circulatingMarketCap * 1e8 : 0,
    f162: q.pe, f163: q.pe, f164: q.pe, f167: q.pb,
    f168: q.turnoverRate, f169: q.change, f170: q.changePercent, f171: q.high && q.low && q.prevClose ? (q.high - q.low)/q.prevClose*100 : 0
  };
}
async function sdkFetchKline(code){
  const klines = await sdk.getHistoryKline(code, { period: 'daily' });
  if(!klines || !klines.length) return [];
  return klines.slice(-320).map(k=>({
    date: k.date, open: k.open, close: k.close, high: k.high, low: k.low,
    volume: k.volume, amount: k.amount || 0, chg: k.changePercent || 0, turn: k.turnoverRate || 0
  }));
}
async function sdkFetchFlow(code){
  try{
    const flow = await sdk.getFundFlow(toTencentCode(code));
    if(!flow) return {};
    return {
      f62: flow.mainNetInflow || 0, f184: flow.mainNetInflowPercent || 0,
      f66: flow.superLargeNetInflow || 0, f69: flow.superLargeNetInflowPercent || 0,
      f72: flow.largeNetInflow || 0, f75: flow.largeNetInflowPercent || 0,
      f78: flow.mediumNetInflow || 0, f84: flow.smallNetInflow || 0
    };
  }catch(e){return {}}
}

// ============ 数据获取：腾讯 JSONP ============
function tencentQuote(code){
  return new Promise((resolve,reject)=>{
    const tCode = toTencentCode(code);
    const cb = 'tc_cb_'+Date.now()+Math.random().toString(36).slice(2);
    window[cb] = function(){
      try{
        const raw = document.getElementById('tc_script_'+cb);
        if(raw) raw.remove();
        const text = window['v_'+tCode];
        delete window[cb];
        if(!text) return reject(new Error('无数据'));
        const parts = text.split('~');
        resolve({
          f43: parseFloat(parts[3]), f44: parseFloat(parts[33]), f45: parseFloat(parts[34]),
          f46: parseFloat(parts[5]), f47: parseFloat(parts[6])*100,
          f48: parseFloat(parts[37]) || 0, f50: parseFloat(parts[49]) || null,
          f57: parts[2], f58: parts[1],
          f116: parseFloat(parts[45])*1e8 || 0, f117: parseFloat(parts[46])*1e8 || 0,
          f162: parseFloat(parts[39]) || null, f163: parseFloat(parts[39]) || null,
          f164: parseFloat(parts[39]) || null, f167: parseFloat(parts[46]) || null,
          f168: parseFloat(parts[38]) || null, f169: parseFloat(parts[31]) || 0,
          f170: parseFloat(parts[32]) || 0,
          f171: (parseFloat(parts[33]) - parseFloat(parts[34]))/parseFloat(parts[4])*100 || 0
        });
      }catch(e){reject(e)}
    };
    const script = document.createElement('script');
    script.id = 'tc_script_'+cb;
    script.src = `https://qt.gtimg.cn/q=${tCode}&callback=${cb}`;
    script.onerror = ()=>{reject(new Error('腾讯接口加载失败'))};

function scoreTechnical(q,k){
  const details=[];
  const closes=k.map(x=>x.close);
  const ma5=avg(closes.slice(-5)),ma10=avg(closes.slice(-10)),ma20=avg(closes.slice(-20));
  const price=q.f43||closes[closes.length-1];
  let maS=15,maR='均线交织，震荡格局',maV='震荡';
  if(ma5>ma10&&ma10>ma20){maS=30;maR='短期均线 > 中期 > 长期，多头排列，趋势向上';maV='多头排列'}
  else if(ma5<ma10&&ma10<ma20){maS=5;maR='短期均线 < 中期 < 长期，空头排列，趋势向下';maV='空头排列'}
  details.push({label:'均线形态',value:maV,max:30,score:maS,reason:maR});
  const e12=ema(closes,12),e26=ema(closes,26);
  const dif=e12.map((v,i)=>v-e26[i]);const dea=ema(dif,9);
  const ld=dif[dif.length-1],le=dea[dea.length-1];
  let macdS=3,macdR='DIF<0 且 DIF<DEA，空头排列';
  if(ld>0&&ld>le){macdS=25;macdR='DIF>0 且 DIF>DEA，多头强势'}
  else if(ld>le){macdS=18;macdR='DIF>DEA（金叉状态），多头'}
  else if(ld>0){macdS=8;macdR='DIF>0 但 DIF<DEA，高位回调'}
  details.push({label:'MACD',value:`DIF ${ld.toFixed(3)} / DEA ${le.toFixed(3)}`,max:25,score:macdS,reason:macdR});
  const rsi=calcRSI(closes,14)||50;
  let rsiS=3,rsiR='RSI>75，超买风险大';
  if(rsi>=45&&rsi<=65){rsiS=20;rsiR='RSI 45-65，中性偏强，健康区间'}
  else if(rsi>=30&&rsi<45){rsiS=14;rsiR='RSI 30-45，偏弱但有反弹空间'}

  else if(rsi<30){rsiS=8;rsiR='RSI<30，超卖，可能有反弹机会'}
  details.push({label:'RSI(14)',value:rsi.toFixed(2),max:20,score:rsiS,reason:rsiR});
  const ratio=price/ma20;
  let pS=3,pR='价格显著低于MA20（>5%），弱势';
  if(ratio>=1.05){pS=25;pR='价格高于MA20 5%以上，强势'}
  else if(ratio>=1){pS=18;pR='价格略高于MA20，偏强'}
  else if(ratio>=0.95){pS=10;pR='价格略低于MA20，偏弱'}
  details.push({label:'价格 vs MA20',value:`${(ratio*100).toFixed(1)}%`,max:25,score:pS,reason:pR});
  const total=Math.min(100,Math.max(0,Math.round(maS+macdS+rsiS+pS)));
  return {total, details};
}

function makeTargets(q,k,boll,total){
  const price=q.f43||k[k.length-1].close;
  const atr=calcATR(k,14)||price*0.03;
  const recent20=k.slice(-20);const recent60=k.slice(-60);
  const high20=Math.max(...recent20.map(x=>x.high));
  const high60=Math.max(...recent60.map(x=>x.high));
  const bull=total>=60,bear=total<45;
  const sm=bull?2:1.2, mm=bull?4:2.2, lm=bull?7:4, stm=bear?1.5:2;
  const shortTarget=Math.max(price+atr*sm, Math.min(boll.upper*1.02, price+atr*(sm+1)));
  const midTarget=Math.max(high20, price+atr*mm);
  const longTarget=Math.max(high60, price+atr*lm);
  const stopLoss=Math.max(boll.lower*0.98, price-atr*stm);
  return{
    price, atr, shortTarget, midTarget, longTarget, stopLoss,
    shortReturn:(shortTarget-price)/price*100,
    midReturn:(midTarget-price)/price*100,
    longReturn:(longTarget-price)/price*100,
    stopReturn:(stopLoss-price)/price*100
  };
}

        <tr><td>中线目标</td><td>max(20日高, 现价 + 2.2~4 × ATR)</td></tr>
        <tr><td>长线目标</td><td>max(60日高, 现价 + 4~7 × ATR)</td></tr>
        <tr><td>止损参考</td><td>max(BOLL下轨, 现价 - 1.5~2 × ATR)</td></tr>
      </table>
      <div class="r-note">
        综合评分 = 基本面×30% + 技术面×30% + 资金面×20% + 情绪面×20%。<br>
        ATR = 14日平均真实波动幅度，用于衡量波动性并动态设置目标价。<br>
        评分越高，目标倍数越激进；评分越低，目标越保守、止损越紧。
      </div>
    </div>
  </details>`;
}

// ============ K线绘制 ============
function drawKline(canvas,k){
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth,H=canvas.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const data=k.slice(-60);
  if(!data.length)return;
  const allCloses=k.map(x=>x.close);
  const ma5=[],ma10=[],ma20=[];
  for(let i=0;i<data.length;i++){
    const idx=k.length-data.length+i;
    ma5.push(avg(allCloses.slice(Math.max(0,idx-4),idx+1)));
    ma10.push(avg(allCloses.slice(Math.max(0,idx-9),idx+1)));
    ma20.push(avg(allCloses.slice(Math.max(0,idx-19),idx+1)));
  }
  const allHigh=Math.max(...data.map(x=>x.high),...ma5,...ma10,...ma20);
  const allLow=Math.min(...data.map(x=>x.low),...ma5,...ma10,...ma20);
  const range=allHigh-allLow||1;
  const pad={t:18,r:44,b:22,l:8};
  const cw=W-pad.l-pad.r, ch=H-pad.t-pad.b;
  const pY=p=>pad.t+(allHigh-p)/range*ch;
  const cW=cw/data.length;
  ctx.font='10px -apple-system,sans-serif';
  ctx.textAlign='left';
  for(let i=0;i<=4;i++){
    const y=pad.t+i*ch/4;
    ctx.strokeStyle='#30363d';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    const price=allHigh-i*range/4;
    ctx.fillStyle='#8b949e';ctx.fillText(price.toFixed(2),pad.l+cw+4,y+3);
  }
  data.forEach((d,i)=>{
    const x=pad.l+i*cW+cW/2;
    const up=d.close>=d.open;
    const color=up?'#f85149':'#3fb950';
    ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,pY(d.high));ctx.lineTo(x,pY(d.low));ctx.stroke();
    const top=pY(Math.max(d.open,d.close));
    const bot=pY(Math.min(d.open,d.close));
    const bw=Math.max(2,cW*0.65);
    ctx.fillRect(x-bw/2,top,bw,Math.max(1,bot-top));
  });
  function drawMA(arr,color){
    ctx.strokeStyle=color;ctx.lineWidth=1.2;ctx.beginPath();
    arr.forEach((v,i)=>{
      const x=pad.l+i*cW+cW/2;
      const y=pY(v);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
  }
  drawMA(ma5,'#d29922');drawMA(ma10,'#58a6ff');drawMA(ma20,'#a371f7');
  ctx.fillStyle='#8b949e';ctx.textAlign='left';
  ctx.fillText(data[0].date.slice(5),pad.l,pad.t+ch+14);
  ctx.textAlign='right';
  ctx.fillText(data[data.length-1].date.slice(5),pad.l+cw,pad.t+ch+14);
}

// 方案二：腾讯接口扫描（从腾讯批量列表接口拉取）
async function scanWithTencent(){
  const st = document.getElementById('scanStatus');
  st.textContent = '📥 正在通过腾讯接口获取全市场 A 股行情...';
  const all = [];
  for(let pn=1; pn<=15; pn++){
    const u = `https://push2.eastmoney.com/api/qt/clist/get?pn=${pn}&pz=500&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:1+t:2&fields=f12,f14,f2,f3,f8,f9,f10,f15,f16,f17,f18,f23`;
    try{
      const r = await jsonp(u, 12000);
      const diff = (r && r.data && r.data.diff) || [];
      if(!diff.length) break;
      all.push(...diff);
      if(diff.length < 500) break;
    }catch(e){break}

// 统一扫描入口
async function scanHighScore(){
  if(scanning) return;
  scanning = true;
  const btn = document.getElementById('scanBtn');
  const st = document.getElementById('scanStatus');
  const rs = document.getElementById('scanResults');
  btn.disabled = true;
  btn.innerHTML = '⏳ 扫描中...';
  rs.style.display = 'none';
  st.className = 'scan-status active';

  try{
    // Step 1: 获取股票池
    let all;
    if(currentSource === 'sdk'){
      all = await scanWithSDK();
    }else{
      all = await scanWithTencent();
    }
    if(!all.length) throw new Error('股票池获取失败');

    // Step 2: 剔除
    const filtered = all.filter(s=>!isExcluded(s));
    st.textContent = `📋 共 ${all.length} 只，剔除后剩 ${filtered.length} 只，快速筛选中...`;

    // Step 3: 快速筛选
    const quickList = filtered
      .filter(passQuickFilter)
      .map(s=>({code: String(s.f12||s.code).padStart(6,'0'), name: s.f14||s.name, quick: quickScore(s)}))
      .filter(x=>/^\d{6}$/.test(x.code));
    quickList.sort((a,b)=>b.quick-a.quick);
    const candidates = quickList.slice(0, 100);

    if(!candidates.length) throw new Error('快速筛选后无候选股票');
    st.textContent = `⚙️ 候选 ${candidates.length} 只，正在完整评分...`;

    // Step 4: 完整评分
    const results = [];
    const BATCH = 5;
    for(let i=0; i<candidates.length; i+=BATCH){
      const batch = candidates.slice(i, i+BATCH);
      st.textContent = `⚙️ 完整评分中 ${Math.min(i+BATCH, candidates.length)}/${candidates.length}...`;
      const batchRes = await Promise.all(batch.map(async c=>{
        try{
          const [q, k, f] = await Promise.all([fetchQuote(c.code), fetchKline(c.code), fetchFlow(c.code)]);
          if(!q || !q.f58 || !k || k.length < 20) return null;
          const sF = scoreFundamental(q), sT = scoreTechnical(q, k), sC = scoreCapital(f), sS = scoreSentiment(q);
          const total = Math.round(sF.total*0.3 + sT.total*0.3 + sC.total*0.2 + sS.total*0.2);
          return {code: c.code, name: q.f58||c.name, price: q.f43, chg: q.f170, total, sF: sF.total, sT: sT.total, sC: sC.total, sS: sS.total};
        }catch(e){return null}
      }));
      batchRes.forEach(r=>{if(r)results.push(r)});
    }

    results.sort((a,b)=>b.total-a.total);
    const high85 = results.filter(r=>r.total > 85);
    let display = [], mode = '';
    if(high85.length > 0){ display = high85; mode = 'high85'; }
    else { display = results.slice(0, 15); mode = 'top'; }

    renderScanResults(display, mode, results.length, filtered.length);
    st.textContent = `✅ 扫描完成：主板 ${filtered.length} 只 → 完整评分 ${results.length} 只`;
    st.className = 'scan-status';
  }catch(e){
    st.textContent = '❌ 扫描失败：' + (e.message||'网络错误');
    st.className = 'scan-status';
  }finally{
    scanning = false;
    btn.disabled = false;
    btn.innerHTML = '🔥 重新扫描全市场';
  }
}

// 剔除规则
function isExcluded(s){
  const code = String(s.f12 || s.code || '');
  const name = String(s.f14 || s.name || '');
  if(/^30[01]/.test(code)) return true;
  if(/^68[89]/.test(code)) return true;
  if(/^[48]/.test(code)) return true;
  if(/ST|退/i.test(name)) return true;
  return false;
}

// 快速筛选
function passQuickFilter(s){
  const pe = s.f9, pb = s.f23, turn = s.f8, chg = s.f3;
  if(!(pe > 0) || pe > 30) return false;
  if(!(pb > 0) || pb > 6) return false;
  if(!(turn >= 0.3) || turn > 15) return false;
  if(chg === undefined || chg < -8 || chg > 9) return false;
  return true;
}

// 快速评分
function quickScore(s){
  const q = {
    f43: s.f2||s.price, f170: s.f3||s.changePercent,
    f164: s.f9||s.pe, f167: s.f23||s.pb,
    f168: s.f8||s.turnoverRate, f50: s.f10||s.volumeRatio,
    f171: (s.f18 && s.f15 && s.f16) ? (s.f15 - s.f16) / s.f18 * 100 : 0
  };
  const pe = q.f164 || 0;
  const pb = q.f167 || 0;
  let fs = 0;
  if(pe>0 && pe<=15) fs += 60;
  else if(pe>15 && pe<=30) fs += 48;
  else if(pe>30 && pe<=50) fs += 30;
  else if(pe>50 && pe<=100) fs += 14;
  else fs += 5;
  if(pb>0 && pb<=2) fs += 40;
  else if(pb>2 && pb<=5) fs += 30;
  else if(pb>5 && pb<=10) fs += 16;
  else fs += 5;
  const sS = scoreSentiment(q).total;
  return Math.round(fs*0.3 + 70*0.3 + 70*0.2 + sS*0.2);
}

  const rs = document.getElementById('scanResults');
  if(!list.length){
    rs.innerHTML = `<div class="scan-empty">全市场扫描完成，暂无符合条件的股票<br><span style="font-size:11px">当前市场整体偏弱，或数据源波动，可稍后重试</span></div>`;
    rs.style.display = 'block';
    return;
  }
  let title = mode==='high85' ? `🔥 评分 &gt; 85 的优质股票（共 <b>${list.length}</b> 只）` : `📊 暂无 85+，展示全市场评分 TOP ${list.length}`;
  let html = `<div class="scan-summary">${title}<br><span style="font-size:11px">主板 ${totalMain} 只 · 完整评分 ${totalEvaluated} 只</span></div>`;
  list.forEach((r, idx)=>{
    const rank = idx+1;
    const rankCls = rank===1?'top1':rank===2?'top2':rank===3?'top3':'';
    const scoreCls = r.total>90?'s90':r.total>85?'s85':r.total>80?'s80':'';
    const upCls = (r.chg||0)>=0?'up':'dn';
    const chgStr = r.chg>=0?'+'+fmt(r.chg)+'%':fmt(r.chg)+'%';
    html += `<div class="scan-item" data-code="${r.code}">
      <div class="scan-rank ${rankCls}">${rank}</div>
      <div class="scan-info">
        <div class="scan-name">${r.name}</div>
        <div class="scan-code">${r.code}</div>
        <div class="scan-dims"><span>基 ${r.sF}</span><span>技 ${r.sT}</span><span>资 ${r.sC}</span><span>情 ${r.sS}</span></div>
      </div>
      <div>
        <div class="scan-price ${upCls}">¥${fmt(r.price)}</div>
        <div class="scan-price ${upCls}">${chgStr}</div>
      </div>
      <div class="scan-score ${scoreCls}">${r.total}</div>
    </div>`;
  });
  html += `<div class="scan-note">点击任一股票查看完整分析（K线、目标价、评分依据等）</div>`;
  rs.innerHTML = html;
  rs.style.display = 'block';
  rs.querySelectorAll('.scan-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const c = el.dataset.code;
      document.getElementById('code').value = c;
      analyze(c);
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  });
}

// ============ 主流程 ============
async function analyze(input){
  input = (input||'').trim();
  if(!input){showErr('请输入股票代码或名称');return}
  document.getElementById('status').classList.add('on');
  document.getElementById('error').classList.remove('on');
  document.getElementById('content').classList.remove('on');
  try{
    const resolved = await resolveCode(input);
    if(!resolved) throw new Error('未找到匹配股票，请检查名称或代码');
    const code = resolved.code;
    const [q,k,f] = await Promise.all([fetchQuote(code), fetchKline(code), fetchFlow(code)]);
    if(!q||!q.f58) throw new Error('未找到该股票数据');
    if(!k||k.length<20) throw new Error('K线数据不足，无法计算技术指标');
    render({q,k,f,searchName:resolved.name});
  }catch(e){
    showErr(e.message||'数据获取失败，请稍后重试');
  }finally{
    document.getElementById('status').classList.remove('on');
  }
}
function showErr(msg){
  const el = document.getElementById('error');
  el.textContent = '⚠️ ' + msg;
  el.classList.add('on');
}

// ============ 数据源切换 ============
function setSource(src){
  currentSource = src;
  document.querySelectorAll('#sourceToggle span').forEach(el=>{
    el.classList.toggle('active', el.dataset.src === src);
  });
}
document.getElementById('sourceToggle').addEventListener('click', e=>{
  const src = e.target.dataset.src;
  if(src) setSource(src);
});

// ============ 事件绑定 ============
document.getElementById('go').addEventListener('click',()=>analyze(document.getElementById('code').value));
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')analyze(e.target.value)});
document.getElementById('scanBtn').addEventListener('click',scanHighScore);
document.getElementById('quick').innerHTML = QUICK.map(x=>`<span data-c="${x.code}">${x.name}</span>`).join('');
document.getElementById('quick').addEventListener('click',e=>{
  if(e.target.dataset.c){
    document.getElementById('code').value = e.target.dataset.c;
    analyze(e.target.dataset.c);
  }
});
window.addEventListener('resize',()=>{
  const canvas = document.getElementById('klineChart');
  if(canvas && canvas._kdata){try{drawKline(canvas, canvas._kdata)}catch(e){}}
});
</script>
